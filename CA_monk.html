<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="CA_monk.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Quiz Time!</h1>
      <button id="cross-button" class="cross-button">&times;</button>
    </div>
    <div id="question-container"></div>
    <div id="options-container"></div>
    <button id="next-button">Next</button>
    <div id="result-container"></div>
    <div id="quit-modal" class="modal">
    
      <div class="modal-content">
        <p>Are you sure you want to quit?</p>
        <button id="quit-yes">Quit</button>
        <button id="quit-no">Cancel</button>
      </div>
    </div>
  </div>
  <script src="CA_monk.js"></script>
</body>
</html>
